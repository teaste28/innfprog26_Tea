<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tell tegn i et ord</title>
<style>
body {
font-family: Arial, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
background-color: #f4f4f4;
}
 
h1 {
color: #333;
}
 
input {
padding: 10px;
font-size: 16px;
width: 250px;
margin-bottom: 10px;
}
 
button {
padding: 10px 20px;
font-size: 16px;
cursor: pointer;
}
 
#resultat {
margin-top: 20px;
font-size: 18px;
font-weight: bold;
color: #0056b3;
}
</style>
</head>
<body>
<h1>Tell tegn i et ord</h1>
 
<input type="text" id="ordInput" placeholder="Skriv inn et ord">
<button onclick="tellTegn()">Vis antall tegn</button>
 
<div id="resultat"></div>
 
<script>
function tellTegn() {
const ord = document.getElementById("ordInput").value;
const antallTegn = ord.length;
 
document.getElementById("resultat").textContent =
`Ordet ${ord} består av ${antallTegn} tegn`;
}
</script>
</body>
</html>
