<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Tell antall tegn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"] {
            padding: 8px;
            width: 250px;
            margin-right: 8px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        #resultat {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Tell antall tegn i et ord</h1>

    <label for="ordInput">Skriv inn et ord:</label>
    <input type="text" id="ordInput" placeholder="Skriv et ord her">
    <button onclick="tellTegn()">Tell tegn</button>

    <div id="resultat"></div>

    <script>
        function tellTegn() {
            var inputFelt = document.getElementById("ordInput");
            var ord = inputFelt.value;
            var antallTegn = ord.length;

            var resultatDiv = document.getElementById("resultat");
            resultatDiv.textContent = "Ordet " + ord + " består av " + antallTegn + " tegn";
        }
    </script>
</body>
</html>
