<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Sheet: Variabler</title>
</head>
<body>
    <h1>Variabler i JavaScript</h1>

    <script>
        //DEKLARERE VARIABLER
        /*
         const: deklarere en konstant verdi som ikke skal endres
         let: deklarere en verdi som kan endres
         */
        const firstname = "Téa";
        console.log(firstname);

    </script>
</body>
</html>
