<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop 2: Fargepalettgenerator</title>
    <style>
        #colors{
            width: 100%;
            max-width: 900px;
            margin: 100px auto;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        #colors > div {
            box-sizing: border-box;
            width: 31%;
            height: 150px;
            position: relative;
        }

        #colors > div > span {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #fff;
            padding: .5rem;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <section id="colors">

    </section>
    <script>
        //Tilsatte tegn i en hex-kode:
        const chars = "ABCDEF0123456789"
        //Gjør klar lagring av hex-koder
        let hexCodes = []
        
        //Lage en funksjon som returnerer en hex-kode:
        function hexGenerator() {
            //1: Lag klar en variabel som kan lagre hex-koden:
            let hex = "#"
            //2: Gjøre et tilfeldig utvalg 6 ganger, bruker for loop:
            for(teller = 0; teller <6; teller ++) {
                const randomChar = chars[Math.floor(Math.random() * 16)]
                //her hard koder vi 16 i stedet for chars.length så vi bruker mindre ressurser på å regne siden det aldri kommer til å endre seg
                hex += randomChar
            }
            return hex
        }

        //Kjør hexGenerator 6 ganger, og lagre hvert resultat i hexCodes:
        for(t = 0; t < 6; t ++){
            hexCodes.push(hexGenerator())
        }
        
        //skrive ut HTML-elementer til #colors for hver farge i hexCodes:
        hexCodes.map((h, i) => {
            document.getElementById("colors").innerHTML += `
            <div style="background-color: ${h}">
                <span>${h}</span>
            </div>
            `
        })

    </script>
</body>
</html>
