<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brukerinputoppgave 1</title>
</head>
<body>
    <h1>Brukerinput - oppgave 1</h1>
    <section>
    <form>
        <input type="text" name="firstname" id="firstname" placeholder="Fornavn">
        <button id="save">Lagre</button>
    </form>
    <h2>Navn:</h2>
    <ul id="names">

    </ul>
    </section>

    <script>
        const names =["Marius", "Trine", "Ole"]
        function namePrint() {
            let html = ""
            names.map(name => { html += "<li>" + name + "</li>"})
            document.getElementById("names").innerHTML = html
        }

        namePrint()

        document.getElementById("save").addEventListener("click", function (event){
            event.preventDefault()
            names.push(document.getElementById("firstname").value)
            console.log(names)
            namePrint()
        })
    </script>
</body>
</html>
